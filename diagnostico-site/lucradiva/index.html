<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diagnóstico de Posicionamento · Morno ou Com Molho?</title>
<meta name="description" content="Descubra a temperatura do seu perfil: tá morno ou tá com molho? Diagnóstico do método da Manu Flores.">
<meta name="theme-color" content="#2F3DBC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FFF6F8;--cream-2:#FBE4EA;--cream-3:#F4CCD6;
  --molho:#2F3DBC;--molho-2:#E18B9F;--molho-soft:#E6E8FA;
  --wine:#1D2680;
  --gold:#E18B9F;
  --ink:#1B1D4A;--ink-2:#5A5C85;--ink-3:#9A9BBE;
  --ice:#8FB4E0;
  --line:#F1D3DB;
  --radius:18px;
}
html,body{background:var(--cream);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
b,strong{font-weight:700}
button,a,.chip{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chip,.btn{min-height:44px}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:20;background:rgba(255,246,248,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--molho)}
.hd{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{background:var(--wine);color:#fff;font-weight:700;font-size:13px;padding:5px 11px;border-radius:8px;white-space:nowrap}
.brand span{color:var(--molho-2)}
.hd-title{font-size:13px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sp{flex:1}
.prog{font-size:12px;font-weight:700;color:var(--molho);background:var(--molho-soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.bar{height:3px;background:var(--cream-3)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--molho-2),var(--molho));transition:width .5s ease}

/* ── CHAT ── */
#chat{max-width:640px;margin:0 auto;padding:22px 16px 160px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:9px;align-items:flex-end;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
.row.me{justify-content:flex-end}
.row{scroll-margin-top:72px}
.row.bot .av{visibility:hidden}
.row.bot.last .av{visibility:visible}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:linear-gradient(140deg,var(--molho-2),var(--wine));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 4px rgba(29,38,128,.2)}
.av img{width:100%;height:100%;object-fit:cover}
.msg{max-width:min(460px,82%);padding:10px 14px;border-radius:var(--radius);font-size:14.5px}
.bot .msg{background:var(--cream-2);border-bottom-left-radius:6px}
.me .msg{background:var(--molho);color:#fff;border-bottom-right-radius:6px;font-weight:500;box-shadow:0 2px 8px rgba(47,61,188,.22)}
.msg.wide{max-width:min(520px,88%);padding:0;background:none}
.msg small.q{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--molho);font-weight:700;margin-bottom:3px}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}

/* ── COMPOSER ── */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(to top,var(--cream) 72%,rgba(255,246,248,0));padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.dock-in{max-width:640px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.chip{font:inherit;font-size:14px;font-weight:500;background:#fff;color:var(--ink);border:1.5px solid var(--molho);padding:9px 14px;border-radius:99px;cursor:pointer;transition:all .15s;text-align:left}
@media (hover:hover){.chip:hover{background:var(--molho-soft)}}
form.inp{display:flex;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:5px 5px 5px 16px;box-shadow:0 4px 18px rgba(29,38,128,.08)}
form.inp:focus-within{border-color:var(--molho)}
form.inp input{flex:1;min-width:0;border:none;outline:none;font:inherit;font-size:16px;background:none;color:var(--ink)}
form.inp button{border:none;background:var(--molho);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
form.inp button svg{width:18px;height:18px}
.err{color:var(--molho);font-size:12.5px;margin:6px 0 0 16px;min-height:1em}

/* ── METHOD CARD ── */
.card{background:linear-gradient(160deg,#FFFFFF,var(--cream-2));border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-size:14px}
.card h4{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;line-height:1.2;margin-bottom:6px}
.pil{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.pil:first-of-type{border-top:none}
.pil .e{font-size:20px;line-height:1}
.pil b{display:block;font-size:14px}
.pil small{color:var(--ink-2);font-size:12.5px}

/* ── RESULT ── */
.res{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 24px rgba(29,38,128,.12);border:1px solid var(--line)}
.res-top{padding:18px 16px 16px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,var(--molho-2),var(--molho) 55%,var(--wine))}
.res-top.cold{background:radial-gradient(120% 90% at 100% 0%,#8FB4E0,var(--molho) 60%,var(--wine))}
.res-top.warm{background:radial-gradient(120% 90% at 100% 0%,#F2B8C6,var(--molho) 60%,var(--wine))}
.res-k{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;opacity:.8;font-weight:700}
.res-v{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;line-height:1.05;margin:4px 0 2px}
.res-s{font-size:13.5px;opacity:.92}
.thermo{margin-top:14px}
.thermo-track{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,#BFD3F2 0%,#F4C3CF 45%,#E18B9F 72%,#D9506F 100%)}
.thermo-dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--wine);transform:translate(-50%,-50%);left:0;transition:left 1.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.thermo-lbl{display:flex;justify-content:space-between;font-size:10.5px;margin-top:7px;opacity:.85;font-weight:500}
.res-body{padding:16px}
.score{display:inline-block;font-size:12px;font-weight:700;color:var(--molho);background:var(--molho-soft);padding:4px 10px;border-radius:99px;margin-bottom:10px}
.pr{padding:14px 0;border-top:1px solid var(--cream-2)}
.pr:first-of-type{border-top:none;padding-top:4px}
.pr-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;flex-wrap:wrap}
.pr-h .n{margin-left:auto;font-size:12px;background:var(--cream-2);padding:2px 8px;border-radius:99px}
.pr-h .tag{font-size:10px;letter-spacing:.8px;text-transform:uppercase;background:var(--molho);color:#fff;padding:2px 7px;border-radius:5px}
.meter{height:6px;background:var(--cream-2);border-radius:99px;margin:8px 0;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.2s .3s ease}
.pr p{font-size:13.5px;color:var(--ink-2)}
.fix{margin-top:9px;background:var(--cream);border-left:3px solid var(--molho);border-radius:0 10px 10px 0;padding:9px 11px;font-size:13px;color:var(--ink)}
.fix b{color:var(--molho)}

/* ── INSTAGRAM ── */
.scan{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:0 4px 18px rgba(29,38,128,.08)}
.scan h5{font-size:15px;margin-bottom:8px}
.st{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;color:var(--ink-3)}
.st i{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-style:normal;font-size:11px}
.st.on{color:var(--ink);font-weight:700}
.st.on i{border:2.5px solid var(--cream-3);border-top-color:var(--molho);animation:spin .8s linear infinite}
.st.ok{color:var(--ink-2)}
.st.ok i{background:#DDF3E4;color:#1F9A4A}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-bar{height:5px;background:var(--cream-2);border-radius:99px;margin-top:10px;overflow:hidden}
.scan-bar b{display:block;height:100%;width:4%;background:linear-gradient(90deg,var(--molho-2),var(--molho));border-radius:99px;transition:width .8s ease}
.ig{background:#fff;border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 3px 14px rgba(29,38,128,.1);border:1px solid var(--line)}
.ig-av{width:66px;height:66px;border-radius:50%;flex-shrink:0;border:3px solid var(--molho-2);background:var(--cream-2) center/cover;display:grid;place-items:center;font-weight:800;color:var(--molho);font-size:22px}
.ig-n{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ig > div:last-child{min-width:0}
.ig-u{color:var(--molho);font-weight:700;font-size:13.5px}
.ig-s{font-size:13px;color:var(--ink-3);margin-top:4px}
.ig-s b{color:var(--ink);font-size:14.5px;margin-right:2px}
.ig-s span{margin-right:12px;white-space:nowrap;display:inline-block}
.facts{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:0 4px 18px rgba(29,38,128,.08)}
.facts h5{font-size:15px;margin-bottom:4px}
.fx{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
.fx:first-of-type{border-top:none}
.fx .e{font-size:18px;line-height:1.2}
.fx .ft{display:block;font-size:14px;font-weight:700}
.fx small b{color:var(--ink)}
.bl{list-style:none;margin:6px 0 0;display:grid;gap:5px}
.bl li{font-size:13px;color:var(--ink-2);line-height:1.4}
.bl q{font-style:italic;color:var(--ink)}
.fx small{color:var(--ink-2);font-size:13px}
.bioq{font-style:italic;color:var(--ink-2);background:var(--cream);border-radius:8px;padding:6px 9px;margin-top:5px;font-size:12.5px;white-space:pre-line}
.chip.on{background:var(--molho);color:#fff}
.chip.go{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:700}
.chip.go:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--ink-3);text-align:right;margin-bottom:8px}
.lgpd{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:8px}

/* ── CLOSING ── */
.end{background:radial-gradient(130% 80% at 0% 0%,#4452D6,var(--molho) 55%,var(--wine));color:#fff;border-radius:var(--radius);padding:18px 16px;box-shadow:0 10px 30px rgba(29,38,128,.35);position:relative;overflow:hidden}
.end::after{content:"🌶️";position:absolute;right:-8px;top:-10px;font-size:84px;opacity:.12;transform:rotate(18deg)}
.end h4{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;line-height:1.1;margin-bottom:6px}
.end p{font-size:13.5px;opacity:.9}
.btns{display:grid;gap:8px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;font:inherit;font-weight:700;font-size:14.5px;padding:12px;border-radius:12px;cursor:pointer}
.btn.pri{background:var(--molho-2);color:var(--wine)}
.btn.sec{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.end .k{display:inline-block;background:var(--molho-2);color:var(--wine);font-size:11px;font-weight:800;letter-spacing:.8px;padding:4px 10px;border-radius:99px;margin-bottom:10px}
.end ul{list-style:none;margin:12px 0 4px;display:grid;gap:7px}
.end li{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 11px;font-size:13.5px}
.end .meta{margin-top:10px;background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px}
.end .meta b{color:var(--molho)}
.btn.wa{background:#1FAF55;color:#fff;text-align:center;font-size:15.5px;padding:14px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.btn.link{background:none;color:#fff;opacity:.75;font-weight:500;font-size:13px;padding:6px}

@media (max-width:420px){
  .chip{font-size:14px;padding:10px 13px;min-height:44px}
  .chips{gap:6px}
  #dock{padding-top:14px}
  .hd-title{display:none}
  .msg{max-width:86%}
  .res-v{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand">Manu <span>Flores</span></div>
    <div class="hd-title">Diagnóstico de Posicionamento · Morno ou Com Molho? 🌶️</div>
    <div class="hd-sp"></div>
    <div class="prog" id="prog">0 de 14</div>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>

<main id="chat" aria-live="polite"></main>

<div id="dock"><div class="dock-in" id="dockIn"></div></div>

<script>
/* Opcional: URL da sua foto pro avatar do chat. Vazio = "M" */
const AVATAR_URL = '../manu.jpg';
/* WhatsApp que recebe as interessadas na LucraDiva (só números, com 55) */
const WHATSAPP = '5551992691061';
/* Cada lead vai pra planilha do Google pela função lead do Netlify (SHEET_WEBHOOK_URL) */
const FN_LEAD = '/.netlify/functions/lead';

/* ═══════════════════════════════════════════════════════════
   HELPERS DE CHAT
   ═══════════════════════════════════════════════════════════ */
const chat = document.getElementById('chat');
const dock = document.getElementById('dockIn');
const S = {respostas: {}};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first = n => esc((n || '').trim().split(/\s+/)[0] || '');
const avatarHTML = () => AVATAR_URL ? `<img src="${esc(AVATAR_URL)}" alt="Manu">` : 'M';
const scrollEnd = () => requestAnimationFrame(() => window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'}));

/* O chat sempre reserva embaixo o espaço exato da área de respostas, pra ela nunca cobrir a pergunta */
const dockEl = document.getElementById('dock');
let dockAltura = 0;
new ResizeObserver(() => {
  const h = dockEl.offsetHeight;
  if (h === dockAltura) return;
  dockAltura = h;
  chat.style.paddingBottom = (h + 24) + 'px';
  scrollEnd();
}).observe(dockEl);

/* iPhone: quando o teclado abre, a área de respostas sobe junto e o campo não fica escondido */
if (window.visualViewport){
  const vv = window.visualViewport;
  const acompanhaTeclado = () => {
    const teclado = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    dockEl.style.transform = teclado > 60 ? `translateY(-${teclado}px)` : '';
  };
  vv.addEventListener('resize', acompanhaTeclado);
  vv.addEventListener('scroll', acompanhaTeclado);
}

function setProgress(n, total){
  document.getElementById('prog').textContent = `${n} de ${total}`;
  document.getElementById('bar').style.width = (n / total * 100) + '%';
}

function addRow(who, inner, wide){
  if (who === 'bot') chat.querySelectorAll('.row.bot.last').forEach(r => r.classList.remove('last'));
  const row = document.createElement('div');
  row.className = `row ${who}` + (who === 'bot' ? ' last' : '');
  row.innerHTML = (who === 'bot' ? `<div class="av">${avatarHTML()}</div>` : '') +
                  `<div class="msg${wide ? ' wide' : ''}">${inner}</div>`;
  chat.appendChild(row);
  scrollEnd();
  return row;
}

async function bot(html, {wide = false, delay} = {}){
  if (S.devagar) await sleep(1300);   /* depois do resultado: pausa entre mensagens, como quem lê e pensa */
  const t = addRow('bot', '<span class="typing"><i></i><i></i><i></i></span>');
  t.querySelector('.msg').style.padding = '0';
  const plain = html.replace(/<[^>]+>/g, '');
  const tempo = S.devagar ? Math.min(1400 + plain.length * 28, 4200) : Math.min(450 + plain.length * 13, 1600);
  await sleep(S.devagar ? Math.max(delay ?? 0, tempo) : (delay ?? tempo));
  t.remove();
  return addRow('bot', html, wide);
}
const me = text => addRow('me', esc(text));
const clearDock = () => { dock.innerHTML = ''; };

function askText({placeholder, validate, nota, type = 'text', inputmode = 'text', autocomplete = 'off', mask}){
  return new Promise(resolve => {
    dock.innerHTML = `
      <form class="inp" novalidate>
        <input type="${type}" inputmode="${inputmode}" placeholder="${placeholder}" autocomplete="${autocomplete}" autocapitalize="${type === 'text' && autocomplete === 'given-name' ? 'words' : 'off'}" aria-label="${placeholder}">
        <button type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form><div class="err"></div>${nota ? `<div class="lgpd">${nota}</div>` : ''}`;
    const f = dock.querySelector('form'), i = f.querySelector('input'), e = dock.querySelector('.err');
    if (mask) i.addEventListener('input', () => { i.value = mask(i.value); });
    setTimeout(() => i.focus({preventScroll: true}), 50);
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      const v = i.value.trim();
      const msg = validate ? validate(v) : (v ? '' : 'Escreve aqui pra gente seguir 💬');
      if (msg){ e.textContent = msg; i.focus(); return; }
      clearDock(); resolve(v);
    });
  });
}

function askChoice(options, {multi = false, hint} = {}){
  return new Promise(resolve => {
    const picked = new Set();
    dock.innerHTML = (hint ? `<div class="hint">${hint}</div>` : '') + `<div class="chips"></div>`;
    const wrap = dock.querySelector('.chips');
    let go;
    options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = typeof opt === 'string' ? opt : opt.t;
      b.onclick = () => {
        if (!multi){ clearDock(); resolve(idx); return; }
        picked.has(idx) ? picked.delete(idx) : picked.add(idx);
        b.classList.toggle('on'); go.disabled = picked.size === 0;
      };
      wrap.appendChild(b);
    });
    if (multi){
      go = document.createElement('button');
      go.type = 'button'; go.className = 'chip go'; go.textContent = 'Pronto ✓'; go.disabled = true;
      go.onclick = () => { clearDock(); resolve([...picked].sort((a, b) => a - b)); };
      wrap.appendChild(go);
    }
    scrollEnd();
  });
}

/* ═══════════════════════════════════════════════════════════
   INSTAGRAM (dados públicos via Apify, pela função do Netlify)
   ═══════════════════════════════════════════════════════════ */
const FN = '/.netlify/functions/instagram';

async function buscarPerfil(user){
  try {
    const r = await fetch(`${FN}?user=${encodeURIComponent(user)}`);
    const d = await r.json();
    if (!d.run) return null;
    const fim = Date.now() + 100000;
    while (Date.now() < fim){
      await sleep(3000);
      const c = await (await fetch(`${FN}?run=${d.run}`)).json();
      if (c.status === 'DONE') return c.profile;
      if (c.status !== 'RUNNING') return null;
    }
  } catch {}
  return null;
}

async function scanAoVivo(user){
  const passos = ['Abrindo o perfil no Instagram', 'Lendo bio, seguidores e números', 'Olhando os últimos posts', 'Organizando tudo pra você'];
  const row = addRow('bot', `<div class="scan"><h5>🔎 Analisando o @${esc(user)} ao vivo</h5>
    ${passos.map(t => `<div class="st"><i></i>${t}</div>`).join('')}<div class="scan-bar"><b></b></div></div>`, true);
  const sts = row.querySelectorAll('.st'), bar = row.querySelector('.scan-bar b');
  const marca = i => { sts.forEach((el, j) => { el.className = 'st' + (j < i ? ' ok' : j === i ? ' on' : ''); el.querySelector('i').textContent = j < i ? '✓' : ''; }); bar.style.width = Math.max(4, i / passos.length * 100) + '%'; };
  marca(0);
  let pronto = false, passo = 0;
  const busca = buscarPerfil(user).finally(() => { pronto = true; });
  while (!pronto){
    await sleep(3500);
    if (passo < passos.length - 1){ passo++; marca(passo); }
  }
  const perfil = await busca;
  if (perfil){ for (let i = passo + 1; i <= passos.length; i++){ marca(i); await sleep(350); } }
  row.remove();
  return perfil;
}

/* Lê a bio de verdade: procura cada sinal do método e cita o trecho onde achou */
function lerBio(bio, username){
  const linhas = bio.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const acha = re => linhas.find(l => re.test(l));
  const cita = l => `<q>${esc(l.length > 70 ? l.slice(0, 67) + '…' : l)}</q>`;
  const itens = [];
  const promessa = acha(/\b(ajudo|ensino|transformo|levo|te ajudo|pra voc[eê]|para voc[eê]|pra quem|para quem|mulheres|empreendedoras|m[aã]es|profissionais|resultado|na pr[aá]tica|faturar|vender|vendas|clientes|emagrec|m[eé]todo|do zero|sem precisar)\b/i);
  itens.push(promessa
    ? `✅ <b>Diz pra quem é ou o que entrega:</b> ${cita(promessa)}`
    : `⚠️ <b>Não fica claro pra quem é nem o resultado que você entrega na prática.</b> Testa uma linha assim: <i>"Na prática, eu ___ pra ___"</i>.`);
  const opiniao = acha(/\b(contra|anti|odeio|amo|n[aã]o sou|nada de|chega de|sem mimimi|brutalmente|verdade|real|polêmica|desinfluencer|sem filtro|sincer)/i) || linhas.find(l => /[A-ZÀ-Ú]{4,}.*[A-ZÀ-Ú]{3,}/.test(l));
  itens.push(opiniao
    ? `✅ <b>Tem personalidade:</b> ${cita(opiniao)}`
    : `⚠️ <b>Falta personalidade.</b> Uma opinião ou um jeito seu de falar faz a pessoa lembrar de você.`);
  const oferta = linhas.find(l => /@[a-z0-9._]+/i.test(l.replace('@' + username, '')) || /\b(mentoria|curso|comunidade|consultoria|servi[cç]o|agenda|ebook|e-book|imers[aã]o|aceleradora|atendimento|ensaio|consulta)\b/i.test(l));
  itens.push(oferta
    ? `✅ <b>Mostra uma oferta:</b> ${cita(oferta)}`
    : `⚠️ <b>Não mostra o que você vende.</b> Quem gostou do perfil não sabe como comprar de você.`);
  const cta = acha(/(↓|👇|⬇|⤵|link|clique|comece|agende|garanta|entre|chama|whats|fale|vagas|inscri)/i);
  itens.push(cta
    ? `✅ <b>Chama pra uma ação:</b> ${cita(cta)}`
    : `⚠️ <b>Não chama pra nenhuma ação.</b> Termina a bio com um convite: "comece aqui 👇".`);
  const ok = itens.filter(i => i.startsWith('✅')).length;
  return {ok, html: `<ul class="bl">${itens.map(i => `<li>${i}</li>`).join('')}</ul>`};
}

/* Números reais do perfil + leitura no método */
function metricas(p){
  const posts = p.posts || [];
  const agora = Date.now(), dia = 864e5;
  const em30 = posts.filter(x => x.data && agora - new Date(x.data) <= 30 * dia).length;
  const videos = posts.length ? Math.round(posts.filter(x => x.tipo === 'Video').length / posts.length * 100) : null;
  const comCurtida = posts.filter(x => x.curtidas != null && x.curtidas >= 0);
  const eng = p.seguidores > 0 && comCurtida.length
    ? comCurtida.reduce((a, x) => a + x.curtidas + (x.comentarios || 0), 0) / comCurtida.length / p.seguidores * 100 : null;
  return {posts, em30, videos, eng};
}

   ═══════════════════════════════════════════════════════════ */
function calcular(){
  const soma = {}, max = {};
  PERGUNTAS.forEach((q, i) => {
    const best = Math.max(...q.ops.map(o => o.p));
    soma[q.ing] = (soma[q.ing] || 0) + q.ops[S.respostas[i]].p;
    max[q.ing] = (max[q.ing] || 0) + best;
  });
  const notas = {};
  Object.keys(ING).forEach(k => notas[k] = Math.round(soma[k] / max[k] * 10));
  const total = Math.round(Object.values(notas).reduce((a, b) => a + b, 0) / 4 * 10) / 10;
  return {notas, total};
}

function nivel(t){
  if (t >= 8.5) return {k: 'hot',  label: 'Com Molho 🌶️',      frase: 'Seu perfil tem sabor! Quem passa por ali lembra de você.'};
  if (t >= 6.5) return {k: 'hot',  label: 'Quase no ponto 🔥',  frase: 'Tem tempero, mas ainda falta um ingrediente pra você ser lembrada.'};
  if (t >= 4)   return {k: 'warm', label: 'Morno 🥣',          frase: 'Tá no fogão, mas sem graça: bonito, e ninguém lembra depois.'};
  return          {k: 'cold', label: 'Anêmico 🥶',         frase: 'Sua comunicação tá precisando de um ferro. E a gente resolve!'};
}

      return d.length <= 2 ? (d ? `(${d}` : '') : d.length <= 6 ? `(${d.slice(0, 2)}) ${d.slice(2)}`
        : d.length <= 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; },
    validate: v => /^\d{10,11}$/.test(v.replace(/\D/g, '')) ? '' : 'Confere o número com DDD, diva 📱',
  });
  me('📱 ' + S.whatsapp);
  avanca();
  salvarLead({'Nome': S.nome, 'WhatsApp': S.whatsapp, 'Chamar no WhatsApp': 'https://wa.me/55' + S.whatsapp.replace(/\D/g, ''), 'Etapa': '1. Deixou o WhatsApp'});

  await bot('Agora a parte boa: qual o <b>@</b> do seu Instagram? Vou dar uma olhada nele em tempo real 👀');
  while (true){
    const raw = await askText({placeholder: '@seuperfil',
      nota: 'Uso só os dados públicos do seu perfil pra fazer o diagnóstico.',
      validate: v => /^@?[A-Za-z0-9._]{1,30}$/.test(v.replace(/^.*instagram\.com\//, '').replace(/[/?].*$/, '')) ? '' : 'Só o @, sem espaço 😉'});
    const user = raw.replace(/^.*instagram\.com\//, '').replace(/[/?].*$/, '').replace(/^@/, '').toLowerCase();
    me('@' + user);
    const p = await scanAoVivo(user);
    if (!p){
      await bot(`Não consegui abrir o <b>@${esc(user)}</b> agora 😕 Pode ser que o perfil seja privado ou o @ tenha um errinho.`);
      const c = await askChoice(['Digitar de novo', 'Seguir sem o perfil']);
      me(['Digitar de novo', 'Seguir sem o perfil'][c]);
      if (c === 0){ await bot('Manda o @ certinho:'); continue; }
      S.instagram = user; break;
    }
    await bot(igCard(p), {wide: true, delay: 500});
    await bot('Achei! Esse é você?', {delay: 500});
    const c = await askChoice(['Sou eu ✅', 'Não é esse perfil']);
    me(['Sou eu ✅', 'Não é esse perfil'][c]);
    if (c === 0){ S.perfil = p; S.instagram = p.username; break; }
    await bot('Sem stress! Manda o @ certinho de novo:');
  }
  avanca();
  {
    const m = S.perfil ? metricas(S.perfil) : null;
    salvarLead({'Instagram': '@' + S.instagram,
      'Seguidores': S.perfil ? S.perfil.seguidores : 'não encontrado',
      'Posts nos últimos 30 dias': m ? m.em30 : '',
      'Engajamento (%)': m && m.eng != null ? Math.round(m.eng * 10) / 10 : '',
      'Etapa': '2. Mandou o @'});
  }

  await bot(`Em qual nicho o <b>@${esc(S.instagram)}</b> atua?`);
  S.nicho = NICHOS[await askChoice(NICHOS)]; me(S.nicho); avanca();

  await bot('Me conta uma coisa: qual é o <b>maior desafio</b> do seu perfil hoje?');
  S.desafio = QUALI.desafio[await askChoice(QUALI.desafio)]; me(S.desafio); avanca();

  await bot('Qual é a média de <b>faturamento mensal</b> do seu negócio?');
  S.faturamento = QUALI.fat[await askChoice(QUALI.fat)]; me(S.faturamento); avanca();

  await bot('Você já <b>vende pelo seu perfil</b> hoje, ou seus clientes chegam de outro jeito?');
  S.vendePerfil = QUALI.vendePerfil[await askChoice(QUALI.vendePerfil)]; me(S.vendePerfil); avanca();
  salvarLead({'Nicho': S.nicho, 'Maior desafio': S.desafio, 'Faturamento': S.faturamento, 'Vende pelo perfil': S.vendePerfil, 'Etapa': '3. Respondeu a qualificação'});

  await bot(metodoCard(), {wide: true, delay: 1000});
  await bot('Agora vou te perguntar sobre cada ingrediente. Bora? 👇', {delay: 700});

  let ingAtual = null;
  for (let i = 0; i < PERGUNTAS.length; i++){
    const q = PERGUNTAS[i];
    const label = q.ing !== ingAtual ? `<small class="q">${ING[q.ing].emoji} ${ING[q.ing].nome}</small>` : '';
    ingAtual = q.ing;
    await bot(label + q.q);
    const idx = await askChoice(q.ops);
    S.respostas[i] = idx;
    me(q.ops[idx].t);
    avanca();
  }

  await bot('Pronto! Tô provando o seu molho… 🥄', {delay: 800});
  await sleep(1400);

  const r = calcular();
  const card = resultadoCard(r);
  salvarLead({'Temperatura': card.nivel.label.replace(/\s*\S+$/u, ''), 'Nota': r.total,
    'Ver pra crer': r.notas.vercrer, 'Problema + solução': r.notas.resolve, 'Gancho': r.notas.gancho, 'Personalidade': r.notas.personalidade,
    'Ingrediente mais fraco': ING[card.gargalo].nome, 'Etapa': '4. Viu o resultado'});
  await bot(`<b>${first(S.nome)}</b>, aqui tá a temperatura do seu perfil hoje:`, {delay: 1200});
  const resRow = await bot(card.html, {wide: true, delay: 1400});
  animateResult(resRow);
  setTimeout(() => resRow.scrollIntoView({behavior: 'smooth', block: 'start'}), 80);
  S.devagar = true;
  await sleep(3500);   /* tempo pra ler o resultado */
  if (S.perfil){
    await sleep(700);
    await bot(`E olha o que os números do seu perfil mostram:`, {delay: 800});
    await bot(fatosDoPerfil(S.perfil), {wide: true, delay: 1000});
  }

  await sleep(900);
  const g = ING[card.gargalo];
  if (r.total >= 8.5){
    await bot(`Diva, que orgulho! Seu perfil tá com molho 🌶️ Agora é manter a constância e usar o <b>${g.emoji} ${g.nome}</b> pra deixar ainda mais apimentado.`);
  } else {
    await bot(`Não precisa mexer em tudo de uma vez: começa pelo <b>${g.emoji} ${g.nome}</b>. É ali que o seu perfil tá perdendo mais sabor, e é o ajuste que mais rápido faz você ser lembrada.`);
  }

  const nota = r.total.toFixed(1).replace('.', ',');
  await bot(r.total >= 8.5
    ? `E agora que o molho tá pronto, é hora de transformar isso em venda todo mês. É o que a gente faz na <b>Comunidade LucraDiva</b> 💸`
    : `E olha, ${first(S.nome)}: foi exatamente pra isso que eu criei a <b>Comunidade LucraDiva</b> 💸`, {delay: 900});
  const msg = `Oi Manu! Sou a ${S.nome} (@${S.instagram}), trabalho com ${S.nicho}. Fiz o Diagnóstico de Posicionamento e deu *${card.nivel.label}* (${nota}/10). Meu ingrediente mais fraco foi ${g.nome}.\n\nMeu maior desafio: ${S.desafio}\nFaturamento: ${S.faturamento}\nVendo pelo perfil: ${S.vendePerfil}\n\nQuero saber mais sobre a Comunidade LucraDiva! 🌶️`;
  const wa = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
  const endRow = await bot(`<div class="end">
      <span class="k">COMUNIDADE LUCRADIVA</span>
      <h4>Transforme seu Instagram numa máquina de atrair, gerar confiança e VENDER</h4>
      <p>Sem precisar virar uma personagem pra parecer autoridade.</p>
      <ul>
        <li>🎯 Um posicionamento que tem a sua cara</li>
        <li>🌶️ Conteúdo com MUUUUITO molho</li>
        <li>💬 Parar de depender de indicação</li>
      </ul>
      <div class="meta">A meta? <b>Construir um negócio capaz de chegar aos R$ 10 mil por mês com consistência</b>, mesmo que hoje suas vendas sejam irregulares ou você ainda esteja começando no digital.</div>
      <div class="btns">
        <a class="btn wa" href="${wa}" target="_blank" rel="noopener">💬 Quero entrar na LucraDiva</a>
        <button class="btn link" id="refazer" type="button">↻ Refazer o diagnóstico</button>
      </div></div>`, {wide: true});
  endRow.querySelector('.btn.wa').addEventListener('click', () => salvarLead({'Clicou no WhatsApp': 'SIM', 'Etapa': '5. Clicou no WhatsApp'}));
  endRow.querySelector('#refazer').onclick = () => { window.scrollTo({top: 0}); run(); };
}

run();
</script>
</body>
</html>
